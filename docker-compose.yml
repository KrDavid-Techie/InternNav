services:
  model-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${INTERNVLA_BASE_IMAGE:-cobiz:jetson}
        INSTALL_FLASH_ATTN: ${INSTALL_FLASH_ATTN:-0}
        TORCH_WHEEL_URL: ${TORCH_WHEEL_URL:-https://download-r2.pytorch.org/whl/cu126/torch-2.6.0%2Bcu126-cp310-cp310-linux_aarch64.whl}
        TORCHVISION_WHEEL_URL: ${TORCHVISION_WHEEL_URL:-https://download-r2.pytorch.org/whl/cu126/torchvision-0.21.0-cp310-cp310-linux_aarch64.whl}
    image: internnav-model-server:latest
    restart: "on-failure:3"
    init: true
    working_dir: /app
    shm_size: 8gb
    runtime: nvidia
    gpus: all
    ports:
      - "${INTERNVLA_PORT:-5801}:5801"
    environment:
      HF_HOME: /models/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      INTERNVLA_ATTN_IMPLEMENTATION: ${INTERNVLA_ATTN_IMPLEMENTATION:-sdpa}
      INTERNVLA_INSTRUCTION: ${INTERNVLA_INSTRUCTION:-}
      INTERNVLA_DEBUG_OUTPUT_DIR: ${INTERNVLA_DEBUG_OUTPUT_DIR:-}
    volumes:
      - ${CHECKPOINTS_DIR:-./checkpoints}:/app/checkpoints:ro
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/models/.cache/huggingface
      - ${OUTPUT_DIR:-./output}:/app/output
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - python3
      - scripts/realworld/http_internvla_server.py
      - --device
      - ${INTERNVLA_DEVICE:-cuda:0}
      - --model_path
      - /app/checkpoints/${MODEL_DIR:-InternVLA-N1-DualVLN}
      - --plan_step_gap
      - ${INTERNVLA_PLAN_STEP_GAP:-3}
      - --attn-implementation
      - ${INTERNVLA_ATTN_IMPLEMENTATION:-sdpa}
      - --host
      - 0.0.0.0
      - --port
      - "5801"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5801/health', timeout=3)"
      interval: 20s
      timeout: 5s
      start_period: 10m
      retries: 10
